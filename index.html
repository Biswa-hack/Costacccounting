<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CMA Tapas Bhattachryya — Cost, Tax & Financial Advisory</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 0;
      background: #f5f5f5;
    }

    footer {
      background: #222;
      color: white;
      text-align: center;
      padding: 20px 0;
      padding-bottom: 100px; /* 👈 adds space above floating clientele */
    }

    footer p {
      margin: 5px 0;
    }

    /* Floating Clientele Slider */
    .client-floating {
      position: fixed;
      bottom: 120px; /* 👈 raised so it doesn’t cover WhatsApp/email */
      left: 50%;
      transform: translateX(-50%);
      background: white;
      border-radius: 20px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.15);
      width: 90%;
      max-width: 900px;
      overflow: hidden;
      z-index: 9000;
      padding: 8px 0;
    }

    .client-slider {
      overflow: hidden;
      position: relative;
    }

    .slide-track {
      display: flex;
      width: calc(250px * 10);
      animation: scroll 25s linear infinite;
    }

    .slide {
      height: 60px;
      width: 150px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 15px;
    }

    .slide img {
      height: 45px;
      object-fit: contain;
      filter: grayscale(100%);
      transition: filter 0.3s;
    }

    .slide img:hover {
      filter: grayscale(0%);
    }

    @keyframes scroll {
      0% { transform: translateX(0); }
      100% { transform: translateX(-50%); }
    }
  </style>
</head>

<body>

  <!-- Main content here -->
  <section style="padding:40px; text-align:center;">
    <h1>Welcome to CMA Tapas Bhattachryya & Associates</h1>
    <p>Expert in Cost, Tax & Financial Advisory Services</p>
  </section>

  <!-- Floating Clientele Slider -->
  <div class="client-floating">
    <div class="client-slider">
      <div class="slide-track">
        <div class="slide"><img src="https://upload.wikimedia.org/wikipedia/en/1/1a/WBSEDCL_Logo.png" alt="WBSEDCL"></div>
        <div class="slide"><img src="https://upload.wikimedia.org/wikipedia/en/f/f0/Damodar_Valley_Corporation_Logo.png" alt="DVC"></div>
        <div class="slide"><img src="https://upload.wikimedia.org/wikipedia/en/0/09/Hindustan_Copper_Limited_logo.png" alt="Hindustan Copper"></div>
        <div class="slide"><img src="https://upload.wikimedia.org/wikipedia/en/1/1f/Tata_logo.svg" alt="TATA"></div>
        <div class="slide"><img src="https://upload.wikimedia.org/wikipedia/en/7/74/Maco_logo.png" alt="MACO"></div>
        
        <!-- Duplicate slides for seamless loop -->
        <div class="slide"><img src="https://upload.wikimedia.org/wikipedia/en/1/1a/WBSEDCL_Logo.png" alt="WBSEDCL"></div>
        <div class="slide"><img src="https://upload.wikimedia.org/wikipedia/en/f/f0/Damodar_Valley_Corporation_Logo.png" alt="DVC"></div>
        <div class="slide"><img src="https://upload.wikimedia.org/wikipedia/en/0/09/Hindustan_Copper_Limited_logo.png" alt="Hindustan Copper"></div>
        <div class="slide"><img src="https://upload.wikimedia.org/wikipedia/en/1/1f/Tata_logo.svg" alt="TATA"></div>
        <div class="slide"><img src="https://upload.wikimedia.org/wikipedia/en/7/74/Maco_logo.png" alt="MACO"></div>
      </div>
    </div>
  </div>

  <!-- Footer -->
  <footer>
    <p>📞 +91 98765 43210 | ✉️ info@cma-tapas.com</p>
    <p>Contact Us</p>
    <p>All Rights Reserved © 2025 CMA Tapas Bhattachryya & Associates</p>
  </footer>

</body>
</html>
